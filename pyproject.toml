[project]
name = "er-lab"
version = "0.1.0"
description = "A lab for entity resolution of person records: whole-record embeddings vs deterministic rules, under realistic measured noise, with statistically sound comparisons"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "omegaconf",
    "torch",
    "sentence-transformers",
    "splink",
    "faiss-cpu",
    "hnswlib",
    "bm25s",
    "jellyfish",
    "gecko-syndata",
    "tqdm",
    "requests",
    "pyyaml",
    "jupytext",
    "nbformat",
    "nbclient",
    "ipykernel",
    "ipywidgets",
]

[project.optional-dependencies]
umap = ["umap-learn"]
pseudopeople = ["pseudopeople"]
# Deflate64 (zip method 9) support for the four oldest NC snapshots (2005-2007);
# without it the earliest fully-supported snapshot is 20081104 — see er_lab.data.nc.
nc-legacy = ["zipfile-deflate64"]
# Single-node multi-GPU training (the 4xA100 node) via accelerate; the smoke
# container never installs this — er_lab.train.loop lazy-imports it only when
# cfg.infra.multi_gpu is set.
multi-gpu = ["accelerate"]

[dependency-groups]
# accelerate sits in dev too (not only the multi-gpu extra) so the DDP training
# path gets exercised in CI via a 2-process CPU `accelerate launch` test.
dev = ["pytest", "ruff", "accelerate"]

# torch comes from default PyPI on every platform: the macOS wheel includes MPS,
# the Linux wheel includes CUDA 12 (right for the A100 node; the CPU-only smoke
# container simply carries unused CUDA libs). download.pytorch.org is blocked
# from the build sandbox — see notes/COMPAT.md.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: takes tens of seconds (e.g. the 2-process CPU accelerate launch test)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
